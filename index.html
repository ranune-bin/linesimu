<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>モンスト反射シミュレーター</title><style>body{margin:0;background:#111;color:#fff;font-family:sans-serif}#toolbar{padding:10px;background:#222}canvas{width:100%;max-width:900px;display:block;margin:auto;background:#000;touch-action:none}</style></head><body><div id="toolbar"><input type="file" id="imageInput" accept="image/*"><button id="clearBtn">リセット</button><span id="status">画像を選択してください</span></div><canvas id="canvas"></canvas><script>const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const status=document.getElementById('status');let backgroundImage=null,player=null,guidePoints=[],dragging=false;const REFLECTION_COUNT=20,BALL_RADIUS=20;function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(backgroundImage)ctx.drawImage(backgroundImage,0,0,canvas.width,canvas.height);if(player){ctx.fillStyle='red';ctx.beginPath();ctx.arc(player.x,player.y,BALL_RADIUS,0,Math.PI*2);ctx.fill()}if(guidePoints.length>1){ctx.strokeStyle='#00ffff';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(guidePoints[0].x,guidePoints[0].y);for(const p of guidePoints)ctx.lineTo(p.x,p.y);ctx.stroke();}}function getPosition(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}document.getElementById('imageInput').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{backgroundImage=img;canvas.width=img.width;canvas.height=img.height;status.textContent='画像サイズ '+img.width+' × '+img.height;redraw();URL.revokeObjectURL(url)};img.src=url;});canvas.addEventListener('click',e=>{if(dragging)return;player=getPosition(e);guidePoints=[];redraw();});canvas.addEventListener('pointerdown',()=>{if(player)dragging=true;});canvas.addEventListener('pointermove',e=>{if(!dragging)return;const p=getPosition(e);calculateGuide(player,p);});canvas.addEventListener('pointerup',()=>dragging=false);function calculateGuide(start,target){guidePoints=[];let x=start.x,y=start.y,dx=start.x-target.x,dy=start.y-target.y;const len=Math.hypot(dx,dy);if(len<1)return;dx/=len;dy/=len;guidePoints.push({x,y});const left=BALL_RADIUS,right=canvas.width-BALL_RADIUS,top=BALL_RADIUS,bottom=canvas.height-BALL_RADIUS;for(let i=0;i<REFLECTION_COUNT;i++){let tx=Infinity,ty=Infinity;if(dx>0)tx=(right-x)/dx;else if(dx<0)tx=(left-x)/dx;if(dy>0)ty=(bottom-y)/dy;else if(dy<0)ty=(top-y)/dy;const t=Math.min(tx,ty);x+=dx*t;y+=dy*t;guidePoints.push({x,y});if(tx<ty)dx=-dx;else dy=-dy;}redraw();}document.getElementById('clearBtn').addEventListener('click',()=>{player=null;guidePoints=[];redraw();});</script></body></html>
