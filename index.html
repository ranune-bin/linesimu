<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>モンストガイドシミュレーター</title>

<style>
body{
    margin:0;
    padding:10px;
    font-family:sans-serif;
    background:#f5f5f5;
}

.controls{
    position:sticky;
    top:0;
    z-index:1000;
    background:white;
    padding:10px;
    border-radius:8px;
    box-shadow:0 2px 5px rgba(0,0,0,.15);
}

button{
    padding:8px 12px;
    margin-top:8px;
}

#viewer{
    position:relative;
    display:inline-block;
    margin-top:10px;
}

#stageImage{
    display:block;
    max-width:100%;
}

#guideCanvas{
    position:absolute;
    top:0;
    left:0;
}

.row{
    margin-top:10px;
}
</style>
</head>

<body>

<div class="controls">

<input type="file" id="imageInput">

<div class="row">
<button id="moveBtn">
〇移動モード OFF
</button>
</div>

<div class="row">
反射回数
<input type="number"
       id="bounce"
       value="5"
       min="1"
       max="50">
</div>

</div>

<div id="viewer">

<img id="stageImage">

<canvas id="guideCanvas"></canvas>

</div>

<script>

/* =====================
   調整用設定
===================== */

const CONFIG = {

    field:{
        left:18,
        rightMargin:18,
        top:205,
        bottomMargin:235
    },

    ball:{
        radius:28,
        strokeWidth:4
    },

    guide:{
        color:"#00ff00",
        width:4
    },

    border:{
        color:"rgba(0,0,0,0.25)",
        width:1
    }

};

/* =====================
   初期化
===================== */

const img =
document.getElementById("stageImage");

const canvas =
document.getElementById("guideCanvas");

const ctx =
canvas.getContext("2d");

const bounceInput =
document.getElementById("bounce");

const moveBtn =
document.getElementById("moveBtn");

let moveMode=false;
let draggingBall=false;

let aiming=false;

let aimX=0;
let aimY=0;

const ball={
    x:300,
    y:500
};

/* =====================
   ボタン
===================== */

moveBtn.onclick=()=>{

    moveMode=!moveMode;

    moveBtn.textContent=
    moveMode
    ? "〇移動モード ON"
    : "〇移動モード OFF";

};

/* =====================
   画像読込
===================== */

document
.getElementById("imageInput")
.addEventListener(
"change",
e=>{

    const file=e.target.files[0];

    if(!file) return;

    img.onload=()=>{

        canvas.width =
        img.clientWidth;

        canvas.height =
        img.clientHeight;

        ball.x =
        canvas.width/2;

        ball.y =
        canvas.height*0.8;

        draw();

    };

    img.src =
    URL.createObjectURL(file);

}
);

/* =====================
   描画
===================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawFieldBorder();

    if(aiming){

        drawTrajectory();
        drawPullLine();

    }

    drawBall();

}

function drawFieldBorder(){

    const left=
    CONFIG.field.left;

    const right=
    canvas.width-
    CONFIG.field.rightMargin;

    const top=
    CONFIG.field.top;

    const bottom=
    canvas.height-
    CONFIG.field.bottomMargin;

    ctx.beginPath();

    ctx.rect(
        left,
        top,
        right-left,
        bottom-top
    );

    ctx.strokeStyle=
    CONFIG.border.color;

    ctx.lineWidth=
    CONFIG.border.width;

    ctx.stroke();
}

function drawBall(){

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        CONFIG.ball.radius,
        0,
        Math.PI*2
    );

    ctx.strokeStyle="red";

    ctx.lineWidth=
    CONFIG.ball.strokeWidth;

    ctx.stroke();
}

function drawPullLine(){

    ctx.beginPath();

    ctx.moveTo(
        ball.x,
        ball.y
    );

    ctx.lineTo(
        aimX,
        aimY
    );

    ctx.strokeStyle="red";
    ctx.lineWidth=2;
    ctx.stroke();
}

function drawTrajectory(){

    const bounce =
    Number(
        bounceInput.value
    );

    const left=
    CONFIG.field.left;

    const right=
    canvas.width-
    CONFIG.field.rightMargin;

    const top=
    CONFIG.field.top;

    const bottom=
    canvas.height-
    CONFIG.field.bottomMargin;

    /* 引っ張った方向の反対へ飛ぶ */

    const angle =
    Math.atan2(
        ball.y-aimY,
        ball.x-aimX
    );

    let dx =
    Math.cos(angle);

    let dy =
    Math.sin(angle);

    let x=ball.x;
    let y=ball.y;

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(
        let i=0;
        i<bounce;
        i++
    ){

        let tx =
        dx > 0
        ?
        (right-x)/dx
        :
        (left-x)/dx;

        let ty =
        dy > 0
        ?
        (bottom-y)/dy
        :
        (top-y)/dy;

        let t =
        Math.min(
            Math.abs(tx),
            Math.abs(ty)
        );

        x += dx*t;
        y += dy*t;

        ctx.lineTo(
            x,
            y
        );

        if(
            Math.abs(tx)
            <
            Math.abs(ty)
        ){
            dx *= -1;
        }
        else{
            dy *= -1;
        }

    }

    ctx.strokeStyle=
    CONFIG.guide.color;

    ctx.lineWidth=
    CONFIG.guide.width;

    ctx.stroke();
}

/* =====================
   タッチ操作
===================== */

function getPos(e){

    const rect =
    canvas.getBoundingClientRect();

    const touch =
    e.touches[0];

    return{

        x:
        touch.clientX
        -rect.left,

        y:
        touch.clientY
        -rect.top

    };

}

canvas.addEventListener(
"touchstart",
e=>{

    const p =
    getPos(e);

    const d =
    Math.hypot(
        p.x-ball.x,
        p.y-ball.y
    );

    if(moveMode){

        if(
            d <
            CONFIG.ball.radius + 25
        ){

            draggingBall=true;
            e.preventDefault();

        }

        return;
    }

    aiming=true;

    aimX=p.x;
    aimY=p.y;

    draw();

},
{passive:false}
);

canvas.addEventListener(
"touchmove",
e=>{

    const p =
    getPos(e);

    if(moveMode){

        if(!draggingBall)
            return;

        ball.x=p.x;
        ball.y=p.y;

        draw();

        e.preventDefault();
        return;
    }

    if(!aiming)
        return;

    aimX=p.x;
    aimY=p.y;

    draw();

    e.preventDefault();

},
{passive:false}
);

canvas.addEventListener(
"touchend",
()=>{

    draggingBall=false;

});

bounceInput.addEventListener(
"input",
draw
);

window.addEventListener(
"resize",
()=>{

    if(!img.src)
        return;

    canvas.width =
    img.clientWidth;

    canvas.height =
    img.clientHeight;

    draw();

}
);

</script>

</body>
</html>
