<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>LineSimu - 線のシミュレーション</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d30;--line:#2a3650;--text:#edf2ff;--muted:#a8b4ca;--accent:#7c9cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:18px 20px;border-bottom:1px solid var(--line);background:#10182a}
header h1{font-size:21px;margin:0} header p{margin:5px 0 0;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 290px}
.stage{background:#080d18;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:360px;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:auto;max-height:75vh;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:13px}
h2{font-size:15px;margin:0 0 2px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input,button{font:inherit}
input[type="number"],input[type="color"]{width:100%;background:#0c1425;border:1px solid var(--line);color:var(--text);padding:9px;border-radius:8px}
input[type="file"]{width:100%;font-size:12px;color:var(--muted)}
input[type="range"]{width:100%}
button{border:1px solid var(--line);background:#202c44;color:var(--text);padding:10px 12px;border-radius:9px;cursor:pointer}
button.primary{background:#456be0;border-color:#456be0}
button.active{outline:2px solid var(--accent);background:#263b69}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;color:var(--muted);line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
hr{border:0;border-top:1px solid var(--line);width:100%}
#status{font-size:12px;color:#b9c8e6;min-height:18px}
@media(max-width:760px){main{grid-template-columns:1fr;padding:10px}.stage{min-height:240px}canvas{max-height:none}header{padding:15px}}
</style>
</head>
<body>
<header>
  <h1>LineSimu</h1>
  <p>画像上に線を配置して、反射する軌道をシミュレーション</p>
</header>
<main>
  <section class="stage">
    <canvas id="board" width="900" height="600" aria-label="シミュレーション画面"></canvas>
  </section>
  <aside class="panel">
    <div>
      <h2>画像</h2>
      <label for="imageInput">背景画像を読み込む（端末内で処理します）</label>
      <input id="imageInput" type="file" accept="image/*">
    </div>
    <hr>
    <div>
      <h2>反射壁</h2>
      <div class="buttons">
        <button id="wallMode" class="active">壁を追加</button>
        <button id="launchMode">発射方向</button>
      </div>
      <p class="small">「壁を追加」を選び、画面上をドラッグすると始点から終点まで反射壁を配置できます。</p>
      <button id="undoWall">最後の壁を削除</button>
      <button id="clearWalls">壁をすべて削除</button>
    </div>
    <hr>
    <div>
      <h2>軌道設定</h2>
      <label for="bounceCount">反射回数（1〜30）</label>
      <input id="bounceCount" type="number" min="1" max="30" value="8">
      <div class="row">
        <div><label for="lineColor">軌道の色</label><input id="lineColor" type="color" value="#ffcf5a"></div>
        <div><label for="wallColor">壁の色</label><input id="wallColor" type="color" value="#62d6c7"></div>
      </div>
      <label for="lineWidth">線の太さ</label>
      <input id="lineWidth" type="range" min="1" max="8" value="3">
      <button id="clearPath">軌道を消去</button>
      <button id="saveImage" class="primary">PNGで保存</button>
    </div>
    <div id="status">壁を追加するか、発射方向を指定してください。</div>
    <p class="small">操作：壁をドラッグして配置 →「発射方向」に切替 → 始点から進行方向へドラッグ。壁に当たると反射します。壁の端点や交差部分の挙動は簡易計算です。</p>
  </aside>
</main>
<script>
(() => {
 const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
 const $=id=>document.getElementById(id);
 let bg=null,walls=[],mode='wall',drag=null,launch=null,path=[];
 const W=canvas.width,H=canvas.height;
 function setStatus(s){$('status').textContent=s}
 function draw(){
   ctx.clearRect(0,0,W,H);ctx.fillStyle='#101827';ctx.fillRect(0,0,W,H);
   if(bg){
     const scale=Math.min(W/bg.width,H/bg.height);
     const dw=bg.width*scale,dh=bg.height*scale;
     ctx.drawImage(bg,(W-dw)/2,(H-dh)/2,dw,dh);
     ctx.fillStyle='rgba(5,10,20,.16)';ctx.fillRect(0,0,W,H);
   } else {
     ctx.strokeStyle='rgba(150,170,210,.08)';ctx.lineWidth=1;
     for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
     for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
     ctx.fillStyle='#8290aa';ctx.font='18px system-ui';ctx.textAlign='center';ctx.fillText('画像を読み込むか、ここに反射壁を配置',W/2,H/2);
   }
   walls.forEach(w=>{ctx.strokeStyle=$('wallColor').value;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.stroke();ctx.fillStyle='#e9ffff';[ [w.x1,w.y1],[w.x2,w.y2] ].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],4,0,Math.PI*2);ctx.fill()})});
   if(drag&&mode==='wall'){ctx.strokeStyle=$('wallColor').value;ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(drag.x,drag.y);ctx.lineTo(drag.x2,drag.y2);ctx.stroke();ctx.setLineDash([])}
   if(launch){ctx.strokeStyle=$('lineColor').value;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(launch.x,launch.y);ctx.lineTo(launch.x2,launch.y2);ctx.stroke();ctx.fillStyle=$('lineColor').value;ctx.beginPath();ctx.arc(launch.x,launch.y,6,0,Math.PI*2);ctx.fill()}
   if(path.length>1){ctx.strokeStyle=$('lineColor').value;ctx.lineWidth=+$('lineWidth').value;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);path.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()}
 }
 function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
 function cross(a,b,c,d){const den=(a.x-b.x)*(c.y-d.y)-(a.y-b.y)*(c.x-d.x);if(Math.abs(den)<1e-8)return null;const t=((a.x-c.x)*(c.y-d.y)-(a.y-c.y)*(c.x-d.x))/den;const u=-((a.x-b.x)*(a.y-c.y)-(a.y-b.y)*(a.x-c.x))/den;if(t>1e-5&&t<=1&&u>=0&&u<=1)return{x:a.x+t*(b.x-a.x),y:a.y+t*(b.y-a.y),t,wall:{x1:c.x,y1:c.y,x2:d.x,y2:d.y}};return null}
 function simulate(){
   path=[];if(!launch)return;
   let p={x:launch.x,y:launch.y},dx=launch.x2-launch.x,dy=launch.y2-launch.y,len=Math.hypot(dx,dy);if(len<2){setStatus('発射方向をもう少し長く指定してください。');draw();return}
   dx/=len;dy/=len;path.push({...p});
   const count=Math.max(1,Math.min(30,parseInt($('bounceCount').value)||1));
   for(let bounce=0;bounce<=count;bounce++){
     let best=null;
     // Canvas edges also act as boundaries.
     const edges=[{x1:0,y1:0,x2:W,y2:0},{x1:W,y1:0,x2:W,y2:H},{x1:W,y1:H,x2:0,y2:H},{x1:0,y1:H,x2:0,y2:0},...walls];
     const far={x:p.x+dx*3000,y:p.y+dy*3000};
     for(const wall of edges){const hit=cross(p,far,{x:wall.x1,y:wall.y1},{x:wall.x2,y:wall.y2});if(hit&&(!best||hit.t<best.t))best={...hit,wall}}
     if(!best)break;
     p={x:best.x,y:best.y};path.push({...p});
     const wx=best.wall.x2-best.wall.x1,wy=best.wall.y2-best.wall.y1,wl=Math.hypot(wx,wy);if(!wl)break;
     const nx=-wy/wl,ny=wx/wl,dot=dx*nx+dy*ny;dx=dx-2*dot*nx;dy=dy-2*dot*ny;
     p={x:p.x+dx*.2,y:p.y+dy*.2};
   }
   setStatus('軌道を計算しました。反射点：'+Math.max(0,path.length-1)+' 回');draw();
 }
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);const p=pos(e);drag={...p,x2:p.x,y2:p.y}});
 canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e);drag.x2=p.x;drag.y2=p.y;draw()});
 canvas.addEventListener('pointerup',e=>{if(!drag)return;const p=pos(e);drag.x2=p.x;drag.y2=p.y;if(Math.hypot(p.x-drag.x,p.y-drag.y)>5){if(mode==='wall'){walls.push({...drag});path=[];setStatus('反射壁を追加しました。')}else{launch={...drag};simulate()}}drag=null;draw()});
 $('wallMode').onclick=()=>{mode='wall';$('wallMode').classList.add('active');$('launchMode').classList.remove('active');setStatus('壁を追加する位置をドラッグしてください。')};
 $('launchMode').onclick=()=>{mode='launch';$('launchMode').classList.add('active');$('wallMode').classList.remove('active');setStatus('発射位置から進行方向へドラッグしてください。')};
 $('undoWall').onclick=()=>{walls.pop();simulate();draw()};
 $('clearWalls').onclick=()=>{walls=[];path=[];draw();setStatus('反射壁をすべて削除しました。')};
 $('clearPath').onclick=()=>{path=[];launch=null;draw();setStatus('軌道を消去しました。')};
 ['bounceCount','lineColor','wallColor','lineWidth'].forEach(id=>$(id).addEventListener('input',()=>{if(id==='wallColor'||id==='lineColor'||id==='lineWidth')draw();if(id==='bounceCount'&&launch)simulate()}));
 $('imageInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{bg=im;draw();URL.revokeObjectURL(url);setStatus('画像を読み込みました。画像はこのブラウザ内で処理されます。')};im.src=url};
 $('saveImage').onclick=()=>{draw();const a=document.createElement('a');a.download='linesimu.png';a.href=canvas.toDataURL('image/png');a.click()};
 draw();
})();
</script>
</body>
</html>
