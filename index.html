<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>モンストガイドシミュレーター</title>

<style>

body{
    margin:0;
    padding:10px;
    font-family:sans-serif;
    background:#f5f5f5;
}

.controls{
    position:sticky;
    top:0;
    background:white;
    padding:10px;
    z-index:1000;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

input[type=file]{
    width:100%;
}

#viewer{
    position:relative;
    display:inline-block;
    margin-top:10px;
}

#stageImage{
    display:block;
    max-width:100%;
}

#guideCanvas{
    position:absolute;
    top:0;
    left:0;
}

.row{
    margin-top:10px;
}

button{
    padding:8px;
}

</style>
</head>
<body>

<div class="controls">

<input type="file" id="imageInput">

<div class="row">
角度:
<span id="angleText">45</span>°
<input type="range"
       id="angle"
       min="0"
       max="360"
       value="45">
</div>

<div class="row">
反射回数:
<input type="number"
       id="bounce"
       value="5"
       min="1"
       max="30">
</div>

</div>

<div id="viewer">

<img id="stageImage">

<canvas id="guideCanvas"></canvas>

</div>

<script>

const imageInput = document.getElementById("imageInput");
const img = document.getElementById("stageImage");
const canvas = document.getElementById("guideCanvas");
const ctx = canvas.getContext("2d");

const angleSlider = document.getElementById("angle");
const bounceInput = document.getElementById("bounce");
const angleText = document.getElementById("angleText");

let dragging = false;

const ball = {
    x:300,
    y:500,
    radius:35
};

function resizeCanvas(){

    canvas.width = img.clientWidth;
    canvas.height = img.clientHeight;

    draw();
}

function draw(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawGuide();
    drawBall();
}

function drawBall(){

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI*2
    );

    ctx.strokeStyle="red";
    ctx.lineWidth=4;
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(ball.x-20, ball.y);
    ctx.lineTo(ball.x+20, ball.y);

    ctx.moveTo(ball.x, ball.y-20);
    ctx.lineTo(ball.x, ball.y+20);

    ctx.stroke();
}

function drawGuide(){

    const angle =
        Number(angleSlider.value);

    const bounce =
        Number(bounceInput.value);

    let rad =
        angle * Math.PI / 180;

    let x = ball.x;
    let y = ball.y;

    let dx = Math.cos(rad);
    let dy = -Math.sin(rad);

    ctx.beginPath();
    ctx.moveTo(x,y);

    for(let i=0;i<bounce;i++){

        let tx =
            dx>0
            ? (canvas.width-x)/dx
            : (0-x)/dx;

        let ty =
            dy>0
            ? (canvas.height-y)/dy
            : (0-y)/dy;

        let t =
            Math.min(
                Math.abs(tx),
                Math.abs(ty)
            );

        x += dx*t;
        y += dy*t;

        ctx.lineTo(x,y);

        ctx.fillStyle="yellow";
        ctx.beginPath();
        ctx.arc(x,y,8,0,Math.PI*2);
        ctx.fill();

        if(Math.abs(tx)<Math.abs(ty)){
            dx*=-1;
        }else{
            dy*=-1;
        }
    }

    ctx.strokeStyle="#00ff33";
    ctx.lineWidth=5;
    ctx.stroke();
}

imageInput.addEventListener(
"change",
e=>{

    const file = e.target.files[0];

    if(!file) return;

    img.onload = ()=>{

        resizeCanvas();

        ball.x =
            canvas.width/2;

        ball.y =
            canvas.height*0.8;

        draw();
    };

    img.src =
        URL.createObjectURL(file);
}
);

angleSlider.addEventListener(
"input",
()=>{

    angleText.textContent =
        angleSlider.value;

    draw();
}
);

bounceInput.addEventListener(
"input",
draw
);

function getTouchPos(e){

    const rect =
        canvas.getBoundingClientRect();

    const touch =
        e.touches[0];

    return {

        x:
        touch.clientX
        - rect.left,

        y:
        touch.clientY
        - rect.top
    };
}

canvas.addEventListener(
"touchstart",
e=>{

    const p =
        getTouchPos(e);

    const d =
        Math.hypot(
            p.x-ball.x,
            p.y-ball.y
        );

    if(d<60){

        dragging=true;

        e.preventDefault();
    }
},
{passive:false}
);

canvas.addEventListener(
"touchmove",
e=>{

    if(!dragging) return;

    const p =
        getTouchPos(e);

    ball.x = p.x;
    ball.y = p.y;

    draw();

    e.preventDefault();
},
{passive:false}
);

canvas.addEventListener(
"touchend",
()=>{

    dragging=false;

}
);

window.addEventListener(
"resize",
resizeCanvas
);

</script>

</body>
</html>
